esphome:
  name: weather-station-example
  min_version: 2026.9.1

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../../components
    components: [weather_station]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_token

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: weather_station
    pin: GPIO27
    # Scan first, then replace 0 with the IDs from your own transmitters.
    wind_station_id: 0
    rain_station_id: 0
    temperature:
      name: Temperature
    humidity:
      name: Humidity
    wind_speed:
      name: Wind Speed
    wind_direction:
      name: Wind Direction
    wind_gust:
      name: Wind Gust
    rain_volume:
      name: Rainfall Total
    battery_wind_station:
      name: Wind Station Battery
    battery_rain_station:
      name: Rain Station Battery
